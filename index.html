<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>我的 AI 小屋</title>
                <link rel="stylesheet" href="style.css">
                </head>
                
                <body>
                
                    <div class="chat-container">
                    
                    <header class="chat-header">

                            <div class="header-info">
                                    <div class="header-avatar">♡</div>

                                            <div>
                                                        <h1>我的 AI 小屋</h1>
                                                                    <p>陪你聊天的小 AI</p>
                                                                            </div>
                                                                                </div>

                                                                                    <div class="header-actions">

                                                                                            <button class="menu-button" id="menuButton" aria-label="打开菜单">☰</button>

                                                                                            <div class="online-status">
                                                                                                        <span class="status-dot"></span>
                                                                                                                    在线
                                                                                                                            </div>
</div>

                                                                                                                                                            </header>
<div class="menu-overlay" id="menuOverlay"></div>

<div class="side-menu" id="sideMenu">
    <div class="side-menu-header">
        <div>
            <div class="side-menu-title">🏠 我的小屋</div>
            <div class="side-menu-subtitle">把喜欢的东西都放进来</div>
        </div>
        <button class="menu-close" id="menuClose" aria-label="关闭菜单">×</button>
    </div>

    <nav class="menu-list">
        <button class="menu-item active" data-page="chat">
            <span class="menu-icon">💬</span>
            <span>聊天</span>
        </button>

        <button class="menu-item" data-page="ai-settings">
            <span class="menu-icon">⚙️</span>
            <span>AI 设置</span>
        </button>

        <button class="menu-item" data-page="appearance">
            <span class="menu-icon">🎨</span>
            <span>外观装修</span>
        </button>

        <button class="menu-item" data-page="api">
            <span class="menu-icon">🔑</span>
            <span>API 管理</span>
        </button>

        <button class="menu-item" data-page="memory">
            <span class="menu-icon">🧠</span>
            <span>数据与记忆</span>
        </button>

        <div class="menu-divider"></div>

        <button class="menu-item" data-page="about">
            <span class="menu-icon">ℹ️</span>
            <span>关于小屋</span>
        </button>
    </nav>

    <div class="menu-placeholder" id="menuPlaceholder">
        <div class="placeholder-icon">✨</div>
        <div class="placeholder-title">这里以后会变得很丰富</div>
        <div class="placeholder-text">现在先把小屋的菜单骨架搭起来，下一步再一个个填进去。</div>
    </div>
</div>


<section class="appearance-page" id="appearancePage" aria-label="外观装修">
    <div class="appearance-header">
        <button class="appearance-back" id="appearanceBack">‹ 返回聊天</button>
        <div>
            <h2>🎨 外观装修</h2>
            <p>把聊天的小细节装扮成你喜欢的样子</p>
        </div>
    </div>

    <div class="appearance-card">
        <div class="appearance-card-title">💬 聊天气泡</div>
        <div class="appearance-card-subtitle">先从第一款动态气泡开始</div>

        <div class="bubble-choice selected" data-bubble-style="ribbon" id="ribbonBubbleChoice">
            <div class="bubble-preview ribbon-preview">
                <span class="ribbon-bow">🎀</span>
                <span class="ribbon-sparkle sparkle-one">✦</span>
                <span class="ribbon-sparkle sparkle-two">♡</span>
                <span class="preview-text">你好呀～</span>
            </div>
            <div class="bubble-choice-info">
                <strong>🎀 蝴蝶结信笺</strong>
                <span>轻轻浮动的手帐风气泡</span>
            </div>
            <span class="choice-check">✓</span>
        </div>

        <div class="bubble-coming-soon">
            <span>✨</span>
            <div>
                <strong>更多气泡</strong>
                <p>小翅膀、糖果、水果……后面慢慢加入小屋。</p>
            </div>
        </div>
    </div>

    <div class="appearance-card">
        <div class="appearance-card-title">✨ 动效</div>

        <label class="effect-switch">
            <div>
                <strong>气泡动态</strong>
                <span>让装饰轻轻晃动</span>
            </div>
            <input type="checkbox" id="bubbleAnimationToggle" checked>
            <span class="switch-track"><span class="switch-knob"></span></span>
        </label>
    </div>

    <div class="appearance-card">
        <div class="appearance-card-title">🖼️ 头像</div>
        <div class="appearance-mini-row">
            <span>我的头像 / AI 头像</span>
            <span class="appearance-soon">下一步加入</span>
        </div>
    </div>

    <div class="appearance-card">
        <div class="appearance-card-title">🌸 背景</div>
        <div class="appearance-mini-row">
            <span>聊天背景</span>
            <span class="appearance-soon">下一步加入</span>
        </div>
    </div>
</section>

<main class="chat-messages page-content" id="chatPage">
                                                                                <div class="message-row ai-row">
                                                                                        <div class="avatar">♡</div>

                                                                                            <div>
                                                                                                    <div class="ai-name">小屋 AI</div>

                                                                                                            <div class="message ai-message">
                                                                                                                        嗨～欢迎来到我的小屋！ฅ^•ﻌ•^ฅ
                                                                                                                                </div>
                                                                                                                                    </div>
                                                                                                                                    </div>
                                                                                                            
                                                                                                                        <div class="message user-message">
                                                                                                                                        你好呀！
                                                                                                                                                    </div>
                                                                                                                                                            </main>
                                                                                                                                                            
                                                                                                                                                                    <footer class="chat-input">
                                                                                                                                                                                <textarea
                                                                                                                                                                                    placeholder="和 AI 说点什么吧…"
                                                                                                                                                                                        rows="1"
                                                                                                                                                                                        ></textarea>
                                                                                                                                                                                            <button>发送</button>
                                                                                                                                                                                                    </footer>
                                                                                                                                                                                                    
                                                                                                                                                                                                        <script src="script.js"></script>
                                                                                                                                                                                                    </div>
                                                                                                                                                                                                        
                                                                                                                                                                                                        </body>
                                                                                                                                                                                                        
                                                                                                                                                                                                        </html>               </html>
